<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to choose your color palette</title>
<style>
  /* Poster style faces: Anton (display), Space Mono (labels), Noto Kufi Arabic (Arabic). */
  @font-face { font-family: Anton; src: url(../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: SpaceMono; src: url(../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: SpaceMono; src: url(../node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Kufi; src: url(../node_modules/@fontsource/noto-kufi-arabic/files/noto-kufi-arabic-arabic-800-normal.woff2) format('woff2'); font-weight: 800; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Kufi; src: url(../node_modules/@fontsource/noto-kufi-arabic/files/noto-kufi-arabic-arabic-700-normal.woff2) format('woff2'); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Kufi; src: url(../node_modules/@fontsource/noto-kufi-arabic/files/noto-kufi-arabic-latin-800-normal.woff2) format('woff2'); font-weight: 800; unicode-range: U+0000-00FF; }
  @font-face { font-family: Kufi; src: url(../node_modules/@fontsource/noto-kufi-arabic/files/noto-kufi-arabic-latin-700-normal.woff2) format('woff2'); font-weight: 700; unicode-range: U+0000-00FF; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause</div>
<script type="module" src="film.js"></script>
</body>
</html>
