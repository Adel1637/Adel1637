<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The UI/UX toolkit</title>
<style>
  @font-face { font-family: Hand; src: url(../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Hand; src: url(../node_modules/@fontsource/caveat/files/caveat-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Kalam; src: url(../node_modules/@fontsource/kalam/files/kalam-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Kalam; src: url(../node_modules/@fontsource/kalam/files/kalam-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Ruqaa; src: url(../node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2) format('woff2'); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Ruqaa; src: url(../node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-400-normal.woff2) format('woff2'); font-weight: 400; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Ruqaa; src: url(../node_modules/@fontsource/kalam/files/kalam-latin-700-normal.woff2) format('woff2'); font-weight: 700; unicode-range: U+0000-024F; }
  @font-face { font-family: Ruqaa; src: url(../node_modules/@fontsource/kalam/files/kalam-latin-400-normal.woff2) format('woff2'); font-weight: 400; unicode-range: U+0000-024F; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
